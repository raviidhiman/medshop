<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0e14">
<title>Login — MedStock Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14; --surface: #111820; --border: rgba(100,160,220,0.12);
    --accent: #3dd6f5; --accent2: #4ade80; --text: #e2eaf4;
    --text2: #8ba0b8; --text3: #4a6278; --danger: #f87171;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse 60% 50% at 30% 20%, rgba(61,214,245,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(74,222,128,0.04) 0%, transparent 60%);
  }
  .login-wrap { width: 100%; max-width: 400px; }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .logo-icon {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 18px; display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 30px; margin-bottom: 14px;
    box-shadow: 0 0 40px rgba(61,214,245,0.2);
  }
  h1 { font-family: 'DM Serif Display', serif; font-size: 1.9rem; margin-bottom: 4px; }
  .tagline { color: var(--text2); font-size: 0.85rem; }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
    box-shadow: 0 0 0 1px var(--border), 0 24px 80px rgba(0,0,0,0.5);
  }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  input {
    width: 100%; background: #18232f; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    padding: 12px 14px; font-family: inherit; font-size: 1rem;
    transition: border-color 0.15s;
    -webkit-appearance: none; min-height: 48px;
  }
  input:focus { outline: none; border-color: rgba(61,214,245,0.5); box-shadow: 0 0 0 3px rgba(61,214,245,0.08); }
  .btn-login {
    width: 100%; padding: 14px;
    background: var(--accent); color: #0a0e14;
    border: none; border-radius: 8px;
    font-family: inherit; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s; margin-top: 4px;
    min-height: 48px;
  }
  .btn-login:hover, .btn-login:active { background: #5ee0f7; }
  .hint {
    background: rgba(61,214,245,0.05); border: 1px solid rgba(61,214,245,0.15);
    border-radius: 8px; padding: 12px 14px;
    font-size: 0.8rem; color: var(--text2); margin-top: 16px; text-align: center;
    line-height: 1.5;
  }
  .hint strong { color: var(--accent); font-family: monospace; font-size: 0.9rem; }
  .flash {
    padding: 11px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px;
    background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: var(--danger);
  }
  @media (max-width: 440px) {
    .login-card { padding: 20px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-icon">💊</div>
    <h1>MedStock Pro</h1>
    <p class="tagline">Medical Shop Inventory Management</p>
  </div>
  <div class="login-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash">⚠ {{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login">Sign In →</button>
    </form>
    <div class="hint">
      Demo credentials<br>
      Username: <strong>admin</strong> &nbsp;·&nbsp; Password: <strong>admin123</strong>
    </div>
  </div>
</div>
</body>
</html>
